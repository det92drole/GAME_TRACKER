<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Metrics</title>
    <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>

    <div class="menu-bar">
        <button id="home">Home</button>
        <button id="loadData">Load</button>
        <input type="file" id="fileInput" hidden>
        <button>Settings</button>

    </div>

    <div class="select-bar">

        <select id="playerSelect">
            <option value="" disabled="">Select a player</option>
        </select>

        <div>VS</div>

        <select id="oppSelect">
            <option value="" disabled="">Select an opponent</option>
        </select>

    </div>

    <div class="player-card">

        <div class="player-header">
            <div class="player-name" id="playerCardName"></div>
            <div class="win-count" id="playerCardWinCount"></div>
        </div>

        <div class="games-list" id="games-list">
        </div>

    </div>

    <script src="app.js?v=1" defer></script>

</body>
</html>
