<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local JSON Player Tracker</title>
    <style>
        .modal {
            display: none; /* hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5); /* dark overlay */
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }

        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #lifeContainer {
            display: grid;
            height: 100vh;
        }

        .player {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #222;
            position: relative;
        }

        .zone {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .zone.plus {
            background: #1e3a1e;
        }

        .zone.minus {
            background: #3a1e1e;
        }

        .life {
            font-size: 5rem;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<!-- Trigger button -->
<button id="openModalBtn">MENU</button>

<!-- Modal container -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="closeModalBtn" class="close">&times;</span>

    <h2>Player Tracker</h2>

    <!-- File input to load JSON -->
    <input type="file" id="jsonFile" accept=".json">
    <button id="loadBtn">Load JSON</button>

    <hr>

    <!-- Dropdown populated from localStorage -->
    <select id="playerSelect">
        <option value="">Select a player</option>
    </select>

    <!-- Add new player -->
    <input type="text" id="newPlayer" placeholder="Add new player">
    <button id="addPlayerBtn">Add Player</button>
  </div>
</div>

<div id="lifeContainer"></div>

<script src="app.js"></script>
