<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local JSON Player Tracker</title>
    <style>
        /* Main layout */
        #gameContainer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr auto 1fr;
            height: 100vh;
        }

        /* Player quadrants */
        .quadrant {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
        }

        .lifeRow {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lifeTotal {
            font-size: 32px;
            min-width: 50px;
            text-align: center;
        }

        .lifeBtn {
            width: 40px;
            height: 40px;
            font-size: 20px;
        }

        /* Positioning */

        #playerGrid {
            grid-row: 1 / span 3;
            grid-column: 1 / span 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        /* Middle control bar */
        #middleBar {
            grid-row: 2;
            grid-column: 1 / span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        /* Turn tracker */
        #turnTracker {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #turnCount {
            font-size: 24px;
            min-width: 40px;
            text-align: center;
        }

        /*MODAL MENU*/
        .modal {
            display: none; /* hidden by default */
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5); /* dark overlay */
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }

        .menu-container {
            position: fixed;
            inset: 0; /* fills entire screen */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        #menuWrapper {
            position: relative;
            width: 150px;
            height: 150px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Main menu button */
        #openModalBtn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        /* MOBILE CSS */

        button {
            font-size: 1rem;
            padding: 0.75rem 1rem;
            min-height: 44px;
        }
        body {
            font-size: 18px;
        }

    </style>
</head>
<body>

    <!-- Modal container -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeModalBtn" class="close">&times;</span>


            <div id="playerCount" class="menu-modal">

                <h2>MENU</h2>

                <!-- DETERMINE PLAYER COUNT -->
                <h3>NEW GAME? # of PLAYERS?</h3>
                <div class="button-row">
                    <button id="numPlayer2" class="square-btn">2</button>
                    <button id="numPlayer3" class="square-btn">3</button>
                    <button id="numPlayer4" class="square-btn">4</button>
                </div>


            </div>

            <div id="endGameSave" class="menu-modal">
                <h3>END GAME?</h3>

                <select id="winnerSelect">
                    <option value="">Winner!</option>

                </select>

                <div id="gameSummary">
                    <span id="finalTurnCount">0</span>
                </div>

                <button id="submitGameBtn">Submit Result</button>
                <button id="downloadSaves">Download Saves</button>
            </div>

            <div id="playerAndDeckSelect" class="menu-modal">
                <!-- PLAYER SELECT DROP DOWN-->
                <h2>PLAYER AND DECK SELECT</h2>
                <select id="playerSelect">
                    <option value="">Select a player</option>
                </select>

            </div>

            <div id="loadJSON" class="menu-modal">
                <!-- PLAYER SELECT DROP DOWN-->
                <button id="loadJSONBtn">LOAD HISTORY</button>

            </div>
        </div>
    </div>


    <div id="gameContainer">


        <!--Player Grid-->
        <div id="playerGrid"></div>

        <!-- Middle Bar -->
        <div id="middleBar">
            <button id="menuBtn">Menu</button>

            <div id="turnTracker">
                <button id="turnMinus">-</button>
                <div id="turnCountDisplay">0</div>
                <button id="turnPlus">+</button>
            </div>
        </div>


    </div>

    <script src="app.js"></script>

</body>
</html>
