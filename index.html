<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local JSON Player Tracker</title>
    <style>
        .modal {
            display: none; /* hidden by default */
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5); /* dark overlay */
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }

        .menu-container {
            position: fixed;
            inset: 0;               /* fills entire screen */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        #menuWrapper {
            position: relative;
            width: 150px;
            height: 150px;
            pointer-events: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Main menu button */
        #openModalBtn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        /* Turn tracker wrapper */
        #turnTrackerWrapper {
            position: absolute;
            top: -50px; /* adjust vertical overlap */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 2;
        }

        /* Turn number circle */
        #turnCount {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid #fff;
            background-color: #222;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Small + / - buttons */
        .turn-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background-color: #444;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #playerCount{
            display: none; /* hidden by default */

        }

        #playerAndDeckSelect{
            display: none; /* hidden by default */

        }

        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #lifeContainer {
            display: grid;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .player {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #222;
            position: relative;
        }

        .life {
            display: flex;
            justify-content: space-between; /* pushes them apart */
            align-items: center;
        }

        .player-name {
            font-weight: bold;
        }

        .player-life {
            margin-left: 10px;
        }

        .zone {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .zone.plus {
            background: #1e3a1e;
        }

        .zone.minus {
            background: #3a1e1e;
        }

        .life {
            font-size: 5rem;
            padding: 20px 0;
        }

        .button-row {
            display: flex;
            justify-content: center;   /* centers row */
            gap: 20px;                 /* space between buttons */
            margin-top: 50px;
        }

        .square-btn {
            width: 100px;
            height: 100px;             /* makes them square */
            font-size: 24px;
            cursor: pointer;
        }
       
    </style>
</head>
<body>



<!-- Modal container -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="closeModalBtn" class="close">&times;</span>

    
    <div id="playerCount" class="menu-modal">
        
        <h2>MENU</h2>

        <!-- DETERMINE PLAYER COUNT -->
        <h3>HOW MANY PLAYERS?</h3>
        <div class="button-row">
        <button id="numPlayer2" class="square-btn">2</button>
        <button id="numPlayer3" class="square-btn">3</button>
        <button id="numPlayer4" class="square-btn">4</button>
        </div>

    </div>

    <div id="playerAndDeckSelect" class="menu-modal">
        <h2>PLAYER AND DECK SELECT</h2>
        <select id="playerSelect">
            <option value="">Select a player</option>
        </select>

    </div>

        
  </div>
</div>

<div id="lifeContainer"></div>

<!-- Trigger button -->
<div class="menu-container">
    <div id="menuWrapper">
        <!-- Main menu button -->
        <button id="openModalBtn">MENU</button>
        
        <!-- Turn tracker circle with + / - buttons -->
        <div id="turnTrackerWrapper">
            <button id="turnPlus" class="turn-btn">+</button>
            <div id="turnCount">0</div>
            <button id="turnMinus" class="turn-btn">-</button>
        </div>
    </div>
</div>

<script src="app.js"></script>

<script>

</script>

</body>
</html>
