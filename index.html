<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local JSON Player Tracker</title>
    <style>
        .modal {
            display: none; /* hidden by default */
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5); /* dark overlay */
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }

        .menu-container {
            position: fixed;
            inset: 0;               /* fills entire screen */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        #playerCount{
            display: none; /* hidden by default */

        }

        #playerAndDeckSelect{
            display: none; /* hidden by default */

        }

        #openModalBtn {
            position:fixed;
            width: 150px;
            height: 150px;
            border-radius: 50%;       /* makes it a circle */
            border: none;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto; 
        }

        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        #lifeContainer {
            display: grid;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        .player {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #222;
            position: relative;
        }

        .zone {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .zone.plus {
            background: #1e3a1e;
        }

        .zone.minus {
            background: #3a1e1e;
        }

        .life {
            font-size: 5rem;
            padding: 20px 0;
        }

        .button-row {
            display: flex;
            justify-content: center;   /* centers row */
            gap: 20px;                 /* space between buttons */
            margin-top: 50px;
        }

        .square-btn {
            width: 100px;
            height: 100px;             /* makes them square */
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>



<!-- Modal container -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span id="closeModalBtn" class="close">&times;</span>

    <div id="playerCount" class="menu-modal">
        <h2>MENU</h2>

        <!-- DETERMINE PLAYER COUNT -->
        <h3>HOW MANY PLAYERS?</h3>
        <div class="button-row">
        <button id="numPlayer2" class="square-btn">2</button>
        <button id="numPlayer3" class="square-btn">3</button>
        <button id="numPlayer4" class="square-btn">4</button>
        </div>

    </div>

    <div id="playerAndDeckSelect" class="menu-modal">
        <h2>PLAYER AND DECK SELECT</h2>


    </div>

    
  </div>
</div>

<div id="lifeContainer"></div>

<!-- Trigger button -->
<div class="menu-container">
  <button id="openModalBtn">MENU</button>
</div>

<script src="app.js"></script>
